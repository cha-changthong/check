<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทดสอบ LINE LIFF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white max-w-md w-full rounded-3xl p-6 shadow-xl text-center space-y-4">
    <h1 class="text-xl font-bold text-slate-800">ทดสอบ LINE LIFF</h1>

    <!-- ช่องใส่ LIFF ID สำหรับทดสอบ -->
    <div class="text-left space-y-1">
      <label class="text-xs font-semibold text-slate-600">ใส่ LIFF ID ที่ต้องการทดสอบ:</label>
      <div class="flex space-x-2">
        <input type="text" id="inputLiffId" value="2011269941-XE0w8aRR" class="flex-1 p-2.5 text-xs font-mono border rounded-xl bg-slate-50 outline-none focus:border-emerald-500">
        <button onclick="testLiff(document.getElementById('inputLiffId').value)" class="bg-emerald-600 text-white px-4 py-2 text-xs font-bold rounded-xl active:scale-95 transition">
          ทดสอบ
        </button>
      </div>
    </div>

    <!-- กล่องแสดงผล -->
    <div class="text-left bg-slate-50 p-4 rounded-2xl border text-xs space-y-1.5 font-mono">
      <p><b>ชื่อ LINE:</b> <span id="resName" class="text-emerald-600 font-bold">-</span></p>
      <p><b>User ID:</b> <span id="resUid" class="text-slate-700 font-bold break-all">-</span></p>
    </div>

    <!-- กล่อง Log สด -->
    <div class="text-left bg-slate-900 text-emerald-400 p-3 rounded-xl font-mono text-[11px] space-y-1 h-40 overflow-y-auto" id="logBox"></div>
  </div>

  <script>
    function log(msg) {
      const box = document.getElementById("logBox");
      box.innerHTML += `<div>> ${msg}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    async function testLiff(id) {
      log("--- เริ่มทดสอบ LIFF ID: " + id + " ---");
      try {
        await liff.init({ liffId: id.trim() });
        log("✅ liff.init() สำเร็จ!");

        if (!liff.isLoggedIn()) {
          log("⚠️ ยังไม่ Login -> กำลังสั่ง liff.login()...");
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        document.getElementById("resName").innerText = profile.displayName;
        document.getElementById("resUid").innerText = profile.userId;
        log("🎉 ได้ User ID: " + profile.userId);
        log("🎉 ได้ชื่อ: " + profile.displayName);

      } catch (err) {
        log("❌ Error: " + err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const defaultId = document.getElementById("inputLiffId").value;
      testLiff(defaultId);
    });
  </script>
</body>
</html>
