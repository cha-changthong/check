<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทดสอบดึงข้อมูล LINE LIFF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white max-w-sm w-full rounded-3xl p-6 shadow-xl text-center space-y-4">
    <h1 class="text-lg font-bold text-slate-800">ทดสอบ LINE LIFF ➔ Google Sheet</h1>

    <!-- รูปโปรไฟล์ -->
    <div class="flex justify-center">
      <img id="userImg" src="https://ui-avatars.com/api/?name=User&background=059669&color=fff" class="w-20 h-20 rounded-full border-2 border-emerald-500 shadow">
    </div>

    <!-- แสดงข้อมูล -->
    <div class="text-left bg-slate-50 p-3 rounded-2xl border text-xs space-y-1">
      <p><b>ชื่อ LINE:</b> <span id="userName" class="text-emerald-600 font-bold">กำลังดึง...</span></p>
      <p><b>User ID:</b> <span id="userId" class="text-slate-700 font-mono break-all">กำลังดึง...</span></p>
    </div>

    <!-- กล่อง Log ขั้นตอนการทำงาน -->
    <div id="logBox" class="text-left bg-slate-900 text-emerald-400 p-3 rounded-xl font-mono text-[11px] h-32 overflow-y-auto space-y-1">
      <div>> เริ่มต้นระบบ...</div>
    </div>
  </div>

  <script>
    // 🟢 1. LIFF ID ที่ถูกต้องของคุณ
    const LIFF_ID = "2011269941-XEOw8aRR";

    // 🟢 2. นำ Web App URL ของ Google Apps Script มาวางตรงนี้
    const GAS_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";

    function printLog(text) {
      const box = document.getElementById("logBox");
      box.innerHTML += `<div>> ${text}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    async function startLiff() {
      printLog("กำลังเชื่อมต่อ LIFF...");
      try {
        await liff.init({ liffId: LIFF_ID });
        printLog("✅ liff.init() ผ่านแล้ว!");

        if (!liff.isLoggedIn() && !liff.isInClient()) {
          printLog("ยังไม่ Login -> กำลังไปหน้า Login...");
          liff.login();
          return;
        }

        // ดึงข้อมูลผู้ใช้
        const profile = await liff.getProfile();
        document.getElementById("userName").innerText = profile.displayName;
        document.getElementById("userId").innerText = profile.userId;
        if (profile.pictureUrl) {
          document.getElementById("userImg").src = profile.pictureUrl;
        }
        printLog("✅ ดึงชื่อสำเร็จ: " + profile.displayName);

        // ส่งข้อมูลไป Google Apps Script
        printLog("กำลังส่งข้อมูลไป Sheet Users...");
        fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            userId: profile.userId,
            displayName: profile.displayName,
            pictureUrl: profile.pictureUrl || "-"
          })
        })
        .then(res => res.json())
        .then(data => {
          printLog("🎉 " + data.message);
        })
        .catch(err => {
          printLog("❌ ส่งเข้า Sheet ไม่ผ่าน: " + err.message);
        });

      } catch (err) {
        printLog("❌ เกิดข้อผิดพลาด: " + err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", startLiff);
  </script>
</body>
</html>
